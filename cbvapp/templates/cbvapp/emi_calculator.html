{% extends 'base.html' %}
{% block content %}

<div class="container">
    <div class="jumbotron">
        <h1>EMI Calculator</h1>
        <form method="POST" >
            {% csrf_token %}
            {{form.as_p}}
            
            Loan Amount : <input type="text" name="principal" required><br><br>
            Tenure: <input type="text" name="tenure" required><br><br>
            <input type="submit" class="btn btn-primary" value="calculate">
        </form>
        <br>
        <br>
        {% if res %}
            <h1>EMI need to pay per amount rs:{{res}}</h1>
        {% endif %}
    </div>
</div>
{% endblock %}
